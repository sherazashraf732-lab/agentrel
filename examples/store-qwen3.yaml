# Paper protocol on the TechMart store (tau-bench style) with a local model.
# 8 scenarios x n_runs, plus perturbed environment, tool faults and paraphrases.
# Each scenario takes several model calls; on a CPU-only laptop expect
# roughly 1-3 minutes per run, so n_runs: 2 is about 1-2 hours in total.
name: qwen3-4b-store
model: ollama/qwen3:4b
environment: store
n_runs: 2
fault_probability: 0.2
output_dir: agentrel-results/qwen3-4b-store
