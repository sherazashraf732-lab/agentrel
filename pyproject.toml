[project]
name = "agentrel"
version = "0.1.0"
description = "Measure AI agent reliability: consistency, predictability and robustness (Rabanser et al., ICML 2026)."
readme = "README.md"
authors = [
    { name = "Sheraz Ashraf", email = "sherazashraf732@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "httpx>=0.28",
    "uvicorn>=0.38",
    "litellm>=1.106.6",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
agentrel = "agentrel.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]
